<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote</title>
    <style>
      .container {
        width: 90%;
          max-width: 600px;
          margin: auto;
          background: #fff;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
          font-size: 24px;
          color: #333;
          margin-bottom: 20px;
      }

      p {
          font-size: 16px;
          color: #666;
      }

      .btn {
          display: inline-block;
          margin-top: 20px;
          padding: 10px 20px;
          background: #333;
          color: white;
          text-decoration: none;
          font-size: 16px;
          border-radius: 5px;
          transition: background 0.3s ease;
      }

      .btn:hover {
          background: #555;
      }

      /* Styling the Quote Form */
      form {
        width: 100%;
        display: flex;
        flex-direction: column;
        text-align: left;
      }

      label {
          font-size: 14px;
          font-weight: bold;
          color: #333;
          margin-top: 15px;
      }

      input, select {
          width: 100%;
          padding: 10px;
          margin-top: 5px;
          border: 1px solid #ccc;
          border-radius: 5px;
          font-size: 14px;
      }

      input, select, button {
        width: 100%;
        margin-top: 10px;
      }

      input:focus, select:focus {
          border-color: #333;
          outline: none;
          box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
      }

      button {
          margin-top: 20px;
          padding: 12px;
          background: #333;
          color: white;
          font-size: 16px;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          transition: background 0.3s ease;
      }

      button:hover {
          background: #555;
      }

      @media only screen and (max-width: 768px) {
        .container {
            padding: 10px;
        }

        h1 {
            font-size: 1.5rem;
        }

        p {
            font-size: 0.9rem;
        }
      }
    </style>
</head>
<body>

    <div class="container">
        <h1>Get a Quote</h1>
        <form id="quoteForm" action="https://formsubmit.co/atriyaconcepts@gmail.com" method="POST">
          <input type="hidden" name="_next" value="thank-you.html">
          <input type="hidden" name="_captcha" value="false">
          
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        
          <label for="email">Email ID:</label>
          <input type="email" id="email" name="email" required>
        
          <label for="location">Location of Site:</label>
          <input type="text" id="location" name="location" required>
        
          <label for="size">Size:</label>
          <select id="size" name="size">
              <option value="2BHK">2BHK</option>
              <option value="3BHK">3BHK</option>
              <option value="4BHK">4BHK</option>
              <option value="Villa">Villa</option>
          </select>
        
          <label for="date">Book Slot for Site Visit:</label>
          <input type="date" id="date" name="date" required>
        
          <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
